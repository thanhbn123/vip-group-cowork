[project]
name = "vip-group-cowork"
version = "1.0.0"
description = "VIP GROUP COWORK — cổng đăng nhập, quản trị ID và phân quyền module"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "jinja2>=3.1",
  "python-multipart>=0.0.20",
  "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
