name: cowork-staging

services:
  cowork:
    build:
      context: ../..
      dockerfile: deploy/vps/Dockerfile
    image: cowork-staging:local
    container_name: cowork-staging
    restart: unless-stopped
    env_file:
      - .env.staging
    ports:
      - "127.0.0.1:8899:8899"
    volumes:
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8899/api/health', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
